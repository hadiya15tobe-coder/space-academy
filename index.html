<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Space Academy</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b1030;--card:#1a2155;--ink:#f4f6ff;--mut:#aab4ff;--pk:#ff4fa3;--yl:#ffd23f;--gr:#3ddc97;--bl:#4cc9ff;--rd:#ff5a5f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 20% 0,#2a1f6b,var(--bg) 60%);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;min-height:100vh}
main{max-width:760px;margin:auto;padding:16px 16px 170px}
h1{font-size:2rem;margin:.2em 0;background:linear-gradient(90deg,var(--yl),var(--pk),var(--bl));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:.3em 0;color:var(--yl)}
.card{background:var(--card);border:2px solid #3b46a8;border-radius:18px;padding:14px;margin:10px 0}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:11px 16px;margin:4px 4px 4px 0;cursor:pointer;color:#10153a;background:var(--yl)}
button:hover{filter:brightness(1.1);transform:translateY(-1px)}
button.alt{background:var(--bl)}button.pk{background:var(--pk);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ast{text-align:center;cursor:pointer;border:3px solid transparent}
.ast.sel{border-color:var(--yl);box-shadow:0 0 18px var(--yl)}
.av{width:84px;height:84px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:48px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.bar{background:#0a0e2a;border-radius:10px;height:16px;overflow:hidden;margin:2px 0 8px}
.bar i{display:block;height:100%;transition:width .4s}
.res{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
.res b{font-size:.85rem}
input[type=text]{font:inherit;padding:9px;border-radius:10px;border:2px solid var(--bl);background:#0a0e2a;color:var(--ink)}
.small{color:var(--mut);font-size:.9rem}
#timing{position:relative;height:42px;background:#0a0e2a;border-radius:12px;overflow:hidden;margin:12px 0}
#zone{position:absolute;top:0;height:100%;left:40%;width:20%;background:rgba(61,220,151,.45)}
#dot{position:absolute;top:6px;width:30px;height:30px;border-radius:50%;background:var(--pk)}
#inst{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:min(340px,92vw);display:flex;gap:8px;align-items:flex-end;z-index:9;transition:transform .3s}
#inst.hide{transform:translateY(160%)}
#bub{background:#fff;color:#10153a;border-radius:16px 16px 4px 16px;padding:10px 12px;font-size:.88rem;box-shadow:0 6px 20px #0008}
#bub b{color:#c2185b}
#ico{font-size:44px;background:var(--pk);border-radius:50%;width:62px;height:62px;display:flex;align-items:center;justify-content:center;flex:none;border:3px solid #fff;cursor:pointer}
.tag{display:inline-block;background:var(--pk);color:#fff;border-radius:8px;padding:2px 8px;font-size:.75rem;font-weight:700}
</style></head><body><main id="app"></main>
<div id="inst" class="hide"><div id="bub"></div><div id="ico" title="Tap to hide or show">🧑‍🚀</div></div>
<script>
const $=s=>document.querySelector(s),app=$("#app");
let cust=[];
const BASE=[
{n:"Nova",e:"👩‍🚀",c:"#ff4fa3",role:"Engineer",perk:"Solar panels give +30% power",k:"pow"},
{n:"Orion",e:"👨‍🚀",c:"#4cc9ff",role:"Doctor",perk:"Rest restores extra morale",k:"mor"},
{n:"Sage",e:"🧑‍🌾",c:"#3ddc97",role:"Botanist",perk:"Farming grows +30% food",k:"food"},
{n:"Kai",e:"🧑‍🔬",c:"#ffd23f",role:"Geologist",perk:"Research earns +30% points",k:"res"}];
const MIS={
moon:{name:"Moon: Shackleton Crater rim",icon:"🌙",delay:"about 1.3 seconds each way",
 info:"Artemis is exploring the Moon’s south pole, where sunlight is low and some craters stay in permanent shadow. Surface temperatures swing from about 127 °C in sunlight to about −173 °C at night.",
 start:{o2:75,pow:65,food:65,shield:30,fuel:55,mor:60}},
mars:{name:"Mars: Jezero Crater",icon:"🔴",delay:"3 to 22 minutes each way",
 info:"Jezero is an ancient river delta where the Perseverance rover searches for signs of past life. Mars has gravity of about 0.38 g, a very thin air layer, and almost no magnetic shield.",
 start:{o2:70,pow:55,food:60,shield:25,fuel:50,mor:55}}};
const PREP=[
"On the space station, astronauts exercise about 2 hours a day. Without it, muscles and bones get weaker in microgravity.",
"Before a spacewalk, astronauts breathe pure oxygen to flush nitrogen out of their blood and avoid decompression sickness.",
"Moon dust is sharp and sticky, and Apollo crews found it clung to suits and scratched equipment. Cleaning gear is serious work."];
const FACTS={flare:"NASA’s DONKI database logs solar flares and storms. In May 2024 it recorded a G5 geomagnetic storm, the strongest in about 20 years, and a flare as large as X8.7.",
shelter:"During the Apollo era, a huge solar storm in August 1972 hit between Apollo 16 and 17. Luckily no crew was in space. Today, mission planners build storm shelters.",
debris:"Tens of thousands of pieces of space junk are tracked. The space station sometimes fires thrusters to dodge them.",
temp:"Machines and people both need heat control. On the Moon, a lunar night lasts about 14 Earth days, so power storage matters a lot.",
air:"Landing and launch need a clear ‘go’ from controllers. Weather and traffic can delay a flight, and waiting is safer than rushing.",
delay:"Radio signals travel at light speed, but Mars is so far that one message can take 3 to 22 minutes. Crews must decide a lot on their own.",
o2:"One astronaut breathes roughly 0.8 kg of oxygen a day. Oxygen is recycled on the station but every kilogram counts.",
food:"Growing plants helps crews eat fresh food and may help morale. NASA grows lettuce, radishes and peppers on the space station.",
mor:"Teams that feel good work better. Space agencies plan time for calls home, hobbies and rest on long missions."};
const EVENTS=[
{id:"flare",t:"☀️ Solar flare alert!",x:"DONKI shows a big solar flare. Radiation could reach your outpost in about an hour.",f:"flare",ch:[
 {t:"Hide in the storm shelter",fx:{pow:-8,mor:-5},m:"Safe! You lost some time and power, but you took no radiation."},
 {t:"Keep working and trust your shield",fx:{},need:55,bad:{mor:-25,o2:-5},m:"Your shield level decides this one."}]},
{id:"debris",t:"🛰️ Space debris near orbit!",x:"A piece of old rocket is passing close to your supply ship’s path.",f:"debris",ch:[
 {t:"Fire thrusters to dodge",fx:{fuel:-15},m:"Dodged it! It cost fuel."},
 {t:"Stay put and hope",fx:{},need:null,gamble:.35,bad:{fuel:-10,pow:-15},m:"Space is big, but risky."}]},
{id:"temp",t:"🥶 Temperature crash!",x:"Outside temperature is falling fast. Heaters will drain your batteries.",f:"temp",ch:[
 {t:"Turn heaters up",fx:{pow:-20},m:"Warm and safe, but your batteries dropped."},
 {t:"Save power, wear warm layers",fx:{mor:-12,pow:-6},m:"Chilly! Morale fell, but you saved power."}]},
{id:"air",t:"🚀 Landing clearance?",x:"A cargo lander wants permission to land with supplies. The landing pad has dust clouds.",f:"air",ch:[
 {t:"Clear the pad first (takes effort)",fx:{pow:-8,o2:-3,food:12,o2b:10},m:"Pad cleared. Supplies arrived safely."},
 {t:"Tell lander to wait a day",fx:{mor:-4,fuel:-4},m:"Safe, but supplies come late."}]},
{id:"o2",t:"💨 Oxygen leak!",x:"A small seal is leaking. Alarms are blinking.",f:"o2",ch:[
 {t:"Stop and repair it now",fx:{o2:-4,pow:-6},m:"Fixed. A little air was lost."},
 {t:"Patch fast and keep researching",fx:{o2:-18,score:8},m:"More research, but you lost lots of air."}]},
{id:"food",t:"🌱 Crop trouble!",x:"The plants look sick. The lights are too dim.",f:"food",ch:[
 {t:"Boost grow lights",fx:{pow:-12,food:10},m:"Plants recovered."},
 {t:"Eat stored food instead",fx:{food:-12},m:"Your supplies shrank."}]},
{id:"meteor",t:"☄️ Micrometeoroid hit!",x:"A tiny fast space rock hit the hull. Is your shield thick enough?",f:"debris",ch:[{t:"Patch the hull now",fx:{o2:-6,shield:-5,pow:-6},m:"Patched, but it cost air and power."},{t:"Trust your shield",fx:{},need:50,bad:{o2:-22,shield:-10},m:"Shield check"}]},
{id:"dust",site:"mars",t:"🌪️ Dust storm!",x:"Mars dust is covering your solar panels and blocking sunlight.",f:"temp",ch:[{t:"Sit it out and save power",fx:{pow:-14,mor:-8},m:"You waited it out, but power dropped."},{t:"Go outside and clean panels",fx:{o2:-8,pow:6},gamble:.4,bad:{pow:-15,mor:-8},m:"Panels cleaned, power returned."}]},
{id:"night",site:"moon",t:"🌑 Long shadow!",x:"A long shadow is crossing your solar panels. Batteries will carry the base.",f:"temp",ch:[{t:"Switch to battery saver",fx:{pow:-10,mor:-6},m:"Dim lights, but you lasted."},{t:"Run everything at full power",fx:{pow:-24,score:10},m:"Extra research, but the batteries drained."}]},
{id:"mor",t:"💬 Crew feeling low",x:"Everyone misses home. Is it time for a call or a game night?",f:"mor",ch:[
 {t:"Game night!",fx:{mor:20,pow:-4},m:"Spirits are up."},
 {t:"Keep working",fx:{score:6,mor:-10},m:"Extra points, but a tired crew."}]},
{id:"delay",t:"📡 Strange reading!",x:"An alarm shows odd pressure numbers. You can ask Mission Control or decide now.",f:"delay",ch:[
 {t:"MC",ask:1,fx:{shield:5},m:"Helpful advice arrived."},
 {t:"Decide yourself",fx:{},gamble:.5,bad:{o2:-12,pow:-8},m:"Brave, but risky."}]}];

let st={};
const clamp=v=>Math.max(0,Math.min(100,v));
function inst(txt){const b=$("#bub");b.innerHTML="<b>Cmdr Nova says:</b><br>"+txt;$("#inst").classList.remove("hide")}
$("#ico").onclick=()=>$("#inst").classList.toggle("hide");
function av(a){return a.img?`<div class="av"><img src="${a.img}" alt=""></div>`:`<div class="av" style="background:${a.c}">${a.e}</div>`}

function title(){
 $("#inst").classList.add("hide");
 app.innerHTML=`<h1>🚀 Space Academy</h1><div class="card"><p>Run a Moon base for 20 sols, then land on the Moon (days). Balance oxygen, power, food, shielding, fuel and morale. Every choice costs something.</p><p class="small">Facts in this game are based on real NASA science. The solar storm events are inspired by NASA’s DONKI records.</p><button onclick="pick()">Start training!</button></div>`;
 setTimeout(()=>inst("Welcome, cadet! I’m Commander Nova, your instructor. I’ll pop up with real space facts."),400);
}
function pick(){
 const all=[...BASE,...cust];
 app.innerHTML=`<h2>Choose your astronaut</h2><div class="grid">${all.map((a,i)=>`<div class="card ast ${st.a===a?"sel":""}" onclick="st.a=all[${i}];pick()">${av(a)}<b>${a.n}</b><div class="small">${a.role||"Explorer"}<br>${a.perk||"+5 starting morale"}</div></div>`).join("")}</div>
 <div class="card"><b>Add your own astronaut design</b><br><span class="small">Upload a picture and give a name.</span><br><input type="text" id="cn" placeholder="Astronaut name" maxlength="14"> <input type="file" id="cf" accept="image/*"></div>
 <button ${st.a?"":"disabled"} onclick="prep()">Next: Prep training</button>`;
 $("#cf").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=160;const x=c.getContext("2d");const s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);const a={n:$("#cn").value||"Explorer",img:c.toDataURL("image/jpeg",.8),k:"x"};cust.push(a);st.a=a;pick();inst("Great design, "+a.n+"! Space suits are custom fit for every astronaut.")};im.src=r.result};r.readAsDataURL(f)};
 inst("Pick your teammate. Each has a special skill. You can also upload your own design!");
}
let pr={r:0,s:0,p:0,raf:0};
function prep(){pr={r:0,s:0,p:0,raf:0};round()}
function round(){
 cancelAnimationFrame(pr.raf);
 if(pr.r>=3){const sc=pr.s;app.innerHTML=`<h2>Training done!</h2><div class="card">${av(st.a)}You hit ${sc} of 3 targets. ${sc>=2?"You’re strong and ready. Bonus starting morale!":"Good effort. Every day of practice helps."}</div><button onclick="pickM()">Choose mission</button>`;st.fit=sc;inst("Training complete! Strong teams plan ahead before every launch.");return}
 app.innerHTML=`<h2>Astronaut prep exercise ${pr.r+1}/3</h2><div class="card"><div class="small">Press the button when the pink dot is in the green zone.</div><div id="timing"><div id="zone"></div><div id="dot"></div></div><button class="pk" id="hit">Now!</button></div>`;
 inst(PREP[pr.r]);let t0=performance.now();const sp=0.0012+pr.r*0.0005;
 const tick=n=>{pr.p=Math.abs(((n-t0)*sp)%2-1);$("#dot").style.left=pr.p*(($("#timing").clientWidth)-30)+"px";pr.raf=requestAnimationFrame(tick)};pr.raf=requestAnimationFrame(tick);
 $("#hit").onclick=()=>{cancelAnimationFrame(pr.raf);const ok=pr.p>.38&&pr.p<.62;if(ok)pr.s++;$("#hit").outerHTML=`<b>${ok?"✅ Perfect!":"❌ Missed"}</b> <button onclick="pr.r++;round()">Next</button>`}}
function pickM(){
 app.innerHTML=`<h2>Choose your mission</h2>`+Object.entries(MIS).map(([k,m])=>`<div class="card"><h2>${m.icon} ${m.name}</h2><p>${m.info}</p><p class="small">Radio delay to Earth: ${m.delay}</p><button class="alt" onclick="pre('${k}')">Preflight check</button></div>`).join("");
 inst("The Moon is close, with a short radio delay. Mars is far, so you must be more independent.");
}
const rl=()=>{const r=Math.random();return r<.3?0:r<.7?1:2};
const CD=[
{n:"Fuel load",i:"⛽",r:"fuel",f:"Most of a rocket’s weight at launch is fuel, so every extra kilogram of cargo needs even more fuel.",d:["Tanks are full and sensors are green.","Fuel is a bit low for the trip.","Fuel leak found and tanks are low!"],fx:["Top off the tanks","Fix the leak and refuel"]},
{n:"Space debris on path",i:"🛰️",r:"fuel",f:FACTS.debris,d:["The flight path is clear.","A rocket piece may pass close to the path.","Several tracked objects cross your path!"],fx:["Plan a small dodge burn","Move the launch window"]},
{n:"Pad temperature",i:"🌡️",r:"pow",f:"Cold makes rubber seals stiff, so rockets have temperature limits for launch. Heat strains batteries.",d:["Temperature is in the safe range.","Pad is chilly and batteries are cold.","Freezing! Seals and batteries are at risk!"],fx:["Pre-warm the batteries","Heat the seals and the pad"]},
{n:"Airspace clearance",i:"🚦",r:"food",f:FACTS.air,d:["Controllers say GO. The sky is clear.","A storm cloud is near the launch range.","Storms and aircraft block the airspace!"],fx:["Request a new corridor","Wait for controllers to reroute"]},
{n:"Solar activity (DONKI)",i:"☀️",r:"shield",f:FACTS.flare,d:["DONKI shows a quiet Sun today.","DONKI logged a medium solar flare.","DONKI shows a strong flare and storm warning!"],fx:["Add shield padding","Build a storm shelter plan"]},
{n:"Comms check",i:"📡",r:"mor",f:FACTS.delay,d:["Radio link to Earth is strong.","Signal is a bit noisy.","The main antenna won’t lock on!"],fx:["Re-aim the antenna","Swap in the backup radio"]}];
let pf={};
function pre(k){pf={k,hrs:4,dl:0,c:CD.map(c=>({...c,l:rl()}))};pfShow()}
function pfShow(){
 const col=["var(--gr)","var(--yl)","var(--rd)"],lab=["GO","CAUTION","NO-GO"];
 const reds=pf.c.filter(c=>c.l===2).length;
 app.innerHTML=`<h2>${MIS[pf.k].icon} Pre-operation Go/No-Go</h2><div class="card small">Crew-hours left: <b>${pf.hrs}</b> (caution costs 1 hour to fix, no-go costs 2). Unfixed problems cost supplies at launch. Two or more NO-GOs scrub the launch! Delays so far: ${pf.dl}</div>`+pf.c.map((c,i)=>`<div class="card" style="border-color:${col[c.l]}"><b>${c.i} ${c.n}</b> <span class="tag" style="background:${col[c.l]};color:#10153a">${lab[c.l]}</span><br>${c.d[c.l]}<br>${c.l?`<button class="alt" ${pf.hrs<c.l?"disabled":""} onclick="pfFix(${i})">🔧 ${c.fx[c.l-1]} (${c.l} hr)</button>`:""}<button onclick="inst(pf.c[${i}].f)" style="background:#fff">❓ Why it matters</button></div>`).join("")
 +`<button class="pk" ${reds>1?"disabled":""} onclick="pfGo()">${reds>1?"🚫 Launch scrubbed":"🚀 GO for launch"}</button><button onclick="pfDelay()">⏳ Delay a day (new check, costs food and morale)</button>`;
 inst(reds>1?"Two NO-GO items! Mission control would scrub this launch.":"Check each item carefully. Tap ‘Why it matters’ for a fact.");
}
function pfFix(i){const c=pf.c[i];pf.hrs-=c.l;c.l=0;pfShow()}
function pfDelay(){pf.dl++;pf.hrs=4;pf.c=pf.c.map(c=>({...c,l:rl()}));pfShow()}
function pfGo(){const mod={};pf.c.forEach(c=>{if(c.l)mod[c.r]=(mod[c.r]||0)-(c.l===1?6:16)});mod.food=(mod.food||0)-4*pf.dl;mod.mor=(mod.mor||0)-4*pf.dl;go(pf.k,mod)}
function sc(fx){const f=1+st.day*.03,o={};for(const k in fx)o[k]=fx[k]<0?Math.round(fx[k]*f):fx[k];return o}
function go(k,mod={}){
 const m=MIS[k],s={...m.start};for(const r in mod)s[r]=clamp(s[r]+mod[r]);
 st={...st,k,day:1,sc:0,ch2:0,...s,mor:clamp(s.mor+(st.fit>=2?10:0)+(st.a.k==="x"?5:0)),log:"Launch complete! Unfixed problems cost some starting supplies."};turn();
}
function bars(){
 const R=[["💨 Oxygen","o2","var(--bl)"],["⚡ Power","pow","var(--yl)"],["🍎 Food","food","var(--gr)"],["🛡️ Shield","shield","#b388ff"],["⛽ Fuel","fuel","#ff9f1c"],["😊 Morale","mor","var(--pk)"]];
 return `<div class="card res">${R.map(r=>`<div><b>${r[0]} ${Math.round(st[r[1]])}</b><div class="bar"><i style="width:${st[r[1]]}%;background:${r[2]}"></i></div></div>`).join("")}</div>`;
}
function turn(){
 if(st.day>20||st.o2<=0||st.food<=0||st.pow<=0)return end();
 const m=MIS[st.k];
 app.innerHTML=`<h2>${m.icon} Sol ${st.day} of 20 <span class="tag">${st.a.n}</span></h2>${bars()}<div class="card small">${st.log}</div><div class="card"><b>What will you do today?</b> <span class="small">(Daily upkeep grows as the mission goes on, and your shield wears down.)</span><br>
 <button onclick="act('res')">🔬 Research<br><small>+points, −14 power, −4 oxygen</small></button>
 <button onclick="act('farm')" class="alt">🌱 Farm<br><small>+food, −10 power</small></button>
 <button onclick="act('shield')" class="alt">🛡️ Reinforce shield<br><small>+shield, −8 power</small></button>
 <button onclick="act('sun')">☀️ Clean solar panels<br><small>+power</small></button>
 <button onclick="act('o2')" class="alt">💨 Make oxygen<br><small>+oxygen, −10 power</small></button>
 <button onclick="act('rest')" class="pk">🛌 Exercise and rest<br><small>+morale</small></button></div>`;
 inst(day1fact());
}
function day1fact(){return ["o2","food","mor","temp"].map(k=>FACTS[k])[(st.day-1)%4]}
function ap(fx,mul){for(const k in fx){if(k==="score")st.sc+=fx[k];else if(k==="o2b")continue;else st[k]=clamp(st[k]+fx[k])}}
function act(a){
 const A=st.a.k;const u=Math.floor(st.day/5);let fx={o2:-4-u,food:-3-u,pow:-4-u,shield:-2},msg="";
 if(a==="res"){fx.pow-=14;fx.o2-=4;st.sc+=Math.round(12*(A==="res"?1.3:1));msg="Research done! "}
 if(a==="farm"){fx.pow-=10;fx.food+=Math.round(24*(A==="food"?1.3:1));msg="Plants grew. "}
 if(a==="shield"){fx.pow-=8;st.shield=clamp(st.shield+14);msg="Shield strengthened. "}
 if(a==="sun"){fx.pow+=Math.round(26*(A==="pow"?1.3:1));msg="Panels are shiny. "}
 if(a==="o2"){fx.pow-=10;fx.o2+=24;msg="Oxygen generator split water into air. "}
 if(a==="rest"){fx.mor=Math.round(14*(A==="mor"?1.5:1));msg="Crew refreshed. "}
 ap(fx);st.log=msg;event();
}
function event(){
 const L=EVENTS.filter(e=>!e.site||e.site===st.k);const ev=L[Math.floor(Math.random()*L.length)];st.ev=ev;const m=MIS[st.k];
 app.innerHTML=`<h2>${ev.t}</h2>${bars()}<div class="card">${ev.x}</div>`+ev.ch.map((c,i)=>`<button class="${i?"alt":"pk"}" onclick="choose(${i})">${c.ask?(st.k==="mars"?"📡 Ask Mission Control (wait "+m.delay+")":"📡 Ask Mission Control ("+m.delay+")"):c.t}</button>`).join("");
 inst(FACTS[ev.f]+(st.k==="mars"&&ev.f==="delay"?" On Mars, asking costs time and supplies.":""));
}
function choose(i){
 const ev=st.ev,c=ev.ch[i];let out=c.m;let fx=sc({...c.fx});
 if(c.ask&&st.k==="mars"){fx.o2=(fx.o2||0)-4;fx.food=(fx.food||0)-3;out+=" But the delay cost you time and supplies."}
 ap(fx);
 const nd=c.need!=null?Math.round(c.need+st.day*1.5):0;if(c.need!=null&&st.shield<nd){ap(sc(c.bad));out="Shield too weak! It was "+Math.round(st.shield)+" but needed "+nd+". You took damage."}
 else if(c.need!=null)out="Your shield (level "+Math.round(st.shield)+") held strong. No harm!";
 if(c.gamble!=null&&Math.random()<c.gamble+.15){ap(sc(c.bad));out="That gamble backfired! "+(c.m)}
 st.log=st.log+out;
 if(st.day>3&&!st.ch2&&st.o2>0&&st.food>0&&st.pow>0&&Math.random()<.3){st.ch2=1;st.log+=" ⚠️ Another alert!";return event()}
 st.ch2=0;st.day++;turn();
}
function end(){
 const won=st.day>20&&st.o2>0&&st.food>0&&st.pow>0;
 const score=st.sc+Math.round((st.o2+st.pow+st.food+st.shield+st.mor)/10)+(won?30:0);
 const why=st.o2<=0?"You ran out of oxygen.":st.pow<=0?"You ran out of power.":st.food<=0?"You ran out of food.":"";
 app.innerHTML=`<h1>${won?"🎉 Mission success!":"🛑 Mission over"}</h1><div class="card">${av(st.a)}<p>${won?"Your crew survived all 20 sols!":why+" Real mission planners keep safety margins for this reason."}</p><h2>Score: ${score}</h2><p>Research points: ${st.sc}</p></div>
 <div class="card"><b>What you learned</b><ul><li>Every resource is linked: power runs air, food, heat and research.</li><li>Radiation shielding is worth building before a storm, not during.</li><li>The farther from Earth, the more independent a crew has to be.</li></ul></div><button onclick="st={};title()">Play again</button> <button class="alt" onclick="pickM()">Retry the mission</button>`;

}
